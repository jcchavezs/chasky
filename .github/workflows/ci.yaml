name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: make install-tools

      - name: Run generate
        run: |
          make generate
          git diff --exit-code

      - name: Run modules
        run: |
          make modules
          git diff --exit-code

      - name: Run lint
        run: make lint

      - name: Run vulncheck
        run: make vulncheck

      - name: Run tests
        run: make test
