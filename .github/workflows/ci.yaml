name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: make install-tools

      - name: Run generate
        run: |
          make generate
          git diff --exit-code

      - name: Run modules
        run: |
          make modules
          git diff --exit-code

      - name: Run lint
        run: make lint

      - name: Run vulncheck
        run: make vulncheck

      - name: Run tests
        run: make test
